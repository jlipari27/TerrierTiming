  <style>:root {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #152341;
  background: #e8edf5;
  font-synthesis: none;
  --ink: #14213d;
  --muted: #64728a;
  --line: #dbe2ee;
  --blue: #1644c8;
  --red: #e32636;
  --navy: #10244d;
  --green: #1644c8;
  --lime: #1644c8;
  --white: #fff;
  --shadow: 0 2px 7px #10244d04;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; touch-action: manipulation; }
button:disabled { opacity: .42; cursor: not-allowed; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid #78a4ff; outline-offset: 3px; }
button svg { flex-shrink: 0; }
svg { display: block; }
a { color: inherit; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 21px; line-height: 1.2; letter-spacing: -.65px; font-weight: 780; }
h2 { font-size: 16px; line-height: 1.3; letter-spacing: -.25px; }
h3 { font-size: 15px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.eyebrow { font-size: 12px; letter-spacing: .7px; font-weight: 700; text-transform: uppercase; }
.mono { font-variant-numeric: tabular-nums; }
.shell { width: 100%; max-width: 600px; min-height: 100dvh; margin: 0 auto; background: #f3f5f9; }
.main { width: 100%; min-width: 0; padding: max(12px, env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom)); }
.sidebar { position: fixed; z-index: 50; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 600px); height: calc(70px + env(safe-area-inset-bottom)); padding: 6px 12px max(6px, env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -3px 18px #10244d06; }
.sidebar .brand, .sidebar .brand-sub, .nav-label, .sidebar-bottom, .track-art { display: none; }
.nav { display: flex; justify-content: space-around; gap: 6px; }
.nav button { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px; min-height: 56px; border: 0; border-radius: 10px; background: transparent; color: #69768c; font-size: 12px; font-weight: 650; }
.nav button.active { background: #edf2ff; color: var(--blue); }
.nav button:hover { background: #f0f3fa; }
.nav svg { width: 21px; height: 21px; }
.topbar { min-height: 44px; margin-bottom: 13px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mobile-brand { display: flex; align-items: center; gap: 9px; font-size: 19px; font-weight: 800; letter-spacing: -.6px; line-height: 1.05; color: var(--navy); }
.mobile-brand small { display: block; margin-top: 5px; color: #6b7891; font-size: 9px; letter-spacing: 1.65px; font-weight: 700; }
.brand-mark, .mobile-brand .brand-icon { display: flex; align-items: center; justify-content: center; width: 35px; height: 37px; flex-shrink: 0; background: var(--blue); color: white; border-radius: 9px; border-bottom: 4px solid var(--red); font-size: 16px; font-style: italic; letter-spacing: -2px; font-weight: 850; padding-right: 2px; }
.breadcrumb { display: none; }
.top-tools { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.saved { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 11px; white-space: nowrap; }
.saved svg { width: 13px; height: 13px; }
.prototype-label { color: #5b6b88; border: 1px solid #d2dbea; background: #fff; padding: 3px 6px; border-radius: 4px; font-size: 9px; font-weight: 700; letter-spacing: .6px; }
.intro { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.intro p { font-size: 13px; line-height: 1.45; color: var(--muted); margin-top: 5px; }
.intro-actions { display: flex; gap: 5px; flex-shrink: 0; }
.intro-actions .btn { padding: 10px; }
.intro-actions .desktop-text { display: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); border-radius: 10px; min-height: 44px; padding: 10px 13px; background: #fff; color: var(--ink); font-size: 14px; line-height: 1.3; font-weight: 650; }
.btn:hover { background: #edf2fc; }
.btn.primary, .btn.lime { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn.primary:hover, .btn.lime:hover { background: #1038ad; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: #e8edf7; }
.btn.danger { color: #c91d2b; }
.btn.wide { width: 100%; }
.btn.large { min-height: 50px; font-size: 16px; }
.icon-btn { padding: 10px; min-height: 44px; width: 44px; flex-shrink: 0; }
.small-link { display: inline-flex; align-items: center; min-height: 36px; padding: 4px 0; background: transparent; border: 0; font-size: 14px; font-weight: 650; color: var(--blue); cursor: pointer; text-decoration: none; }
.small-link:hover { text-decoration: underline; }
.group-tabs { display: flex; gap: 8px; overflow-x: auto; margin: 0 -14px 12px; padding: 1px 14px 3px; scrollbar-width: none; }
.group-tabs::-webkit-scrollbar { display: none; }
.group-tab { min-width: 160px; max-width: 210px; min-height: 56px; flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 11px; background: #fff; color: var(--ink); text-align: left; }
.group-tab.active { background: #eaf0ff; border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
.group-tab:hover { border-color: #8ca5e9; }
.group-tab > span:nth-child(2) { min-width: 0; }
.group-tab strong { display: block; font-size: 14px; line-height: 1.2; }
.group-tab small { display: flex; align-items: center; gap: 4px; margin-top: 4px; color: #536682; font-size: 11px; white-space: nowrap; }
.group-icon { display: grid; place-items: center; width: 32px; height: 32px; flex-shrink: 0; border-radius: 9px; background: #eaf0ff; color: var(--blue); }
.group-tab .group-icon { display: none; }
.orange .group-icon { background: #fff0f1; color: var(--red); }
.group-tab .group-indicator { display: none; width: 6px; height: 6px; margin-left: auto; background: var(--red); border-radius: 50%; }
.group-tab.is-running .group-indicator { display: block; box-shadow: 0 0 0 3px #ffe3e6; }
.add-group { display: grid; place-items: center; min-width: 44px; flex: 0 0 44px; padding: 8px; border: 1px dashed #a9b9d4; border-radius: 10px; background: transparent; color: var(--blue); }
.live-grid, .center-column, .side-column { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; gap: 12px; }
.timer-sticky { position: sticky; top: max(6px, env(safe-area-inset-top)); z-index: 20; }
.timing-card { position: relative; overflow: hidden; color: #fff; background: var(--navy); border: 1px solid #102a61; border-radius: 14px; box-shadow: 0 6px 18px #10244d10; }
.timer-top { display: flex; justify-content: space-between; align-items: center; gap: 9px; padding: 12px 14px 0; }
.timer-top .eyebrow { color: #c0ceeb; font-size: 11px; }
.timer-step-title { font-size: 18px; line-height: 1.3; font-weight: 750; letter-spacing: -.3px; }
.phase-pill { display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 4px 7px; border: 1px solid #405782; border-radius: 6px; color: #dfebff; background: #1d3767; font-size: 11px; line-height: 1; white-space: nowrap; }
.phase-pill .dot { width: 5px; height: 5px; background: #fff; border-radius: 50%; }
.timer-center { padding: 9px 14px 10px; text-align: center; }
.timer-context { color: #bdcce8; font-size: 14px; line-height: 1.3; font-weight: 500; margin-bottom: 5px; }
.big-timer { color: #fff; font-size: 48px; font-weight: 650; letter-spacing: -2px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.big-timer .fraction { color: #aebfe2; font-size: .57em; letter-spacing: -.5px; }
.timer-caption { margin-top: 5px; font-size: 12px; line-height: 1.35; color: #bfcee8; min-height: 16px; }
.timer-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; padding: 0 12px 12px; }
.timer-actions .btn { min-height: 48px; padding: 10px 11px; flex: 1; color: #fff; border-color: #49638d; background: #243e6c; font-size: 14px; white-space: nowrap; }
.timer-actions .btn.lime, .timer-actions .btn.primary { border-color: #3566ed; background: #2254de; }
.timer-actions .btn.capture, .btn.capture, .athlete-row .btn.finish { background: var(--red); border-color: var(--red); color: #fff; }
.timer-actions .btn.capture:hover, .btn.capture:hover, .athlete-row .btn.finish:hover { background: #ca1b2a; border-color: #ca1b2a; }
.timer-actions .btn:hover { filter: brightness(1.08); }
.timer-actions .rest-add { flex: 0 0 58px; padding-left: 7px; padding-right: 7px; }

<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"></dialog>
  <script>(()=>{
const Engine=(()=>{
/** Pure timing state: every transition uses wall-clock timestamps, never tick counts. */
const freshRep = index => ({index, starts: {}, finishes: {}, skipped: [], modSkipped: [], unassigned: [], splits: {}, closed: false});
const clone = value => JSON.parse(JSON.stringify(value));
const has = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
const totalReps = group => getPlan(group).length;
const isFinal = group => group.mode === 'planned' && group.repIndex >= totalReps(group) - 1;
const plannedSkips = rep => rep.modSkipped || [];
const touched = rep => rep.closed || Object.keys(rep.starts).length || Object.keys(rep.finishes).length || rep.skipped.some(id => !plannedSkips(rep).includes(id)) || rep.unassigned.length;
const MAX_PACKS = 8;

/** A runner's plan for one run: the group's distance unless the coach changed it or skipped it. */
function athletePlan(group, athlete, index = group.repIndex) {
  const step = getStep(group, index), mod = athlete.mods?.[index] || null;
  const planned = step?.distance ?? group.distance;
  return {planned, distance: mod?.distance ?? planned, skip: !!mod?.skip, modified: !!(mod && (mod.skip || mod.distance != null && mod.distance !== planned))};
}

/** A fresh rep for this group, with any planned skips already applied. */
function freshRepFor(group, index) {
  const rep = freshRep(index);
  for (const athlete of group.athletes) if (athlete.mods?.[index]?.skip) {rep.skipped.push(athlete.id); rep.modSkipped.push(athlete.id);}
  return rep;
}

/** Re-apply planned skips to an open rep after a runner's plan changes. */
function syncPlannedSkips(group, rep) {
  if (rep.closed) return;
  rep.modSkipped ??= [];
  for (const athlete of group.athletes) {
    const wants = !!athlete.mods?.[rep.index]?.skip, planned = rep.modSkipped.includes(athlete.id);
    if (wants && !planned && !has(rep.starts, athlete.id) && !has(rep.finishes, athlete.id) && !rep.skipped.includes(athlete.id)) {rep.skipped.push(athlete.id); rep.modSkipped.push(athlete.id);}
    else if (!wants && planned) {rep.skipped = rep.skipped.filter(id => id !== athlete.id); rep.modSkipped = rep.modSkipped.filter(id => id !== athlete.id);}
  }
}
const completeRep = (group, rep) => group.athletes.every(a => has(rep.finishes, a.id) || rep.skipped.includes(a.id));
const number = (value, fallback, min = 0, max = 86400) => {
  const result = value == null ? fallback : Number(value);
  if (!Number.isFinite(result) || result < min || result > max) throw new Error('Enter a valid number.');
  return result;
};

const SAMPLE_WORKOUT = '3200 tempo\n4min rest\n400-600-400-200 2min rest\n4min break\n5x150 90s rest';
const MAX_RUNS = 1000;
const durationSource = '(\\d+(?:\\.\\d+)?)\\s*(minutes?|mins?|min|m|seconds?|secs?|sec|s)';
const distanceSource = '\\d+(?:\\.\\d+)?\\s*(?:km|m)?';
const isRestLine = text => new RegExp(`^${durationSource}\\s*(?:rest|break|brea|recovery)$`, 'i').test(String(text).trim());
const lineError = (line, message) => new Error(`Line ${line}: ${message}`);
const distanceLabel = distance => `${Number(distance.toFixed(3))}m`;
const MAX_SPLITS = 40;

/** Split points (in meters) inside a run; anything at or beyond the finish is ignored. */
function splitDistances(spec, distance) {
  if (!spec) return [];
  const points = [];
  if (spec.every) for (let d = spec.values[0]; d < distance && points.length < MAX_SPLITS; d += spec.values[0]) points.push(Number(d.toFixed(3)));
  else for (const d of spec.values) if (d < distance) points.push(d);
  return [...new Set(points)].sort((a, b) => a - b);
}

/** Label for the nth (0-based) split of a step: “400m” when planned, otherwise “Split 2”. */
const splitLabel = (step, n) => step?.splits?.[n] != null ? distanceLabel(step.splits[n]) : `Split ${n + 1}`;
const splitCapacity = step => step?.splits?.length ? step.splits.length : MAX_SPLITS;

function durationSeconds(amount, unit, line) {
  const seconds = Number(amount) * (/^m/i.test(unit) ? 60 : 1);
  if (!Number.isFinite(seconds) || seconds < 0 || seconds > 86400) throw lineError(line, 'Recovery must be between 0 seconds and 24 hours.');
  return seconds;
}

/** Parse a small, explicit workout grammar. Every nonblank line must be understood. */
function parseWorkout(text) {
  if (typeof text !== 'string' || !text.trim()) throw new Error('Enter a workout, for example “4x400 1min rest”.');
  if (text.length > 8000) throw new Error('Keep the workout under 8,000 characters.');
  const steps = [], blocks = [], lines = [];
  let pendingRest = null;
  for (const [lineIndex, raw] of text.split(/\r?\n/).entries()) {
    const line = lineIndex + 1;
    let input = raw.trim().replace(/[–—−]/g, '-').replace(/×/g, 'x');
    if (!input) continue;
    const restOnly = input.match(new RegExp(`^${durationSource}\\s*(?:rest|break|brea|recovery)$`, 'i'));
    if (restOnly) {
      if (!steps.length) throw lineError(line, 'Add a running block before recovery.');
      if (pendingRest != null) throw lineError(line, 'Combine consecutive recovery lines into one duration.');
      steps.at(-1).restAfterSeconds = durationSeconds(restOnly[1], restOnly[2], line);
      lines.at(-1).restText = raw.trim();
      pendingRest = line;
      continue;
    }

    let sets = 1, repetitions = 1, repRest = 0, setRest = null;
    const setMatch = input.match(/^(\d+)\s+sets?\s+(?:of\s+)?/i);
    if (setMatch) {sets = Number(setMatch[1]); input = input.slice(setMatch[0].length).trim();}
    let inlineBreak = null;
    const breakMatch = input.match(new RegExp(`[,;]\\s*${durationSource}\\s*(?:break|brea)$`, 'i'));
    if (breakMatch) {
      inlineBreak = durationSeconds(breakMatch[1], breakMatch[2], line);
      input = input.slice(0, breakMatch.index).trim();
    }
    const betweenMatch = input.match(new RegExp(`[,;]?\\s*${durationSource}\\s+(?:rest\\s+)?between\\s+sets$`, 'i'));
    if (betweenMatch) {
      if (!setMatch) throw lineError(line, 'Use “2 sets of 4x400 1min rest, 6min between sets” for set recovery.');
      setRest = durationSeconds(betweenMatch[1], betweenMatch[2], line);
      input = input.slice(0, betweenMatch.index).trim();
    }
    const recoveryMatch = input.match(new RegExp(`[,;]?\\s*(?:with\\s+)?${durationSource}\\s*(?:rest|recovery)(?:\\s+between\\s+(?:reps|runs))?$`, 'i'));
    if (recoveryMatch) {
      repRest = durationSeconds(recoveryMatch[1], recoveryMatch[2], line);
      input = input.slice(0, recoveryMatch.index).trim();
    }
    let splitSpec = null;
    const splitMatch = input.match(/[,;]?\s*(?:with\s+)?splits?\s+(at|every)?\s*(\d+(?:\.\d+)?(?:\s*,\s*\d+(?:\.\d+)?)*)\s*(km|m)?$/i);
    if (splitMatch) {
      const unit = splitMatch[3]?.toLowerCase() === 'km' ? 1000 : 1;
      const values = splitMatch[2].split(',').map(v => Number(v) * unit);
      if (values.some(v => !(v > 0))) throw lineError(line, 'Split distances must be greater than 0.');
      if (splitMatch[1]?.toLowerCase() === 'every' && values.length > 1) throw lineError(line, 'Use one distance after “every”, such as “splits every 200”.');
      splitSpec = {every: splitMatch[1]?.toLowerCase() === 'every', values};
      input = input.slice(0, splitMatch.index).trim();
    }
    const repeatMatch = input.match(/^(\d+)\s*x\s*/i);
    if (repeatMatch) {repetitions = Number(repeatMatch[1]); input = input.slice(repeatMatch[0].length).trim();}
    const runMatch = input.match(new RegExp(`^(${distanceSource}(?:\\s*[-,]\\s*${distanceSource})*)(?:\\s+([a-z][a-z /&'().]*))?$`, 'i'));
    if (!runMatch) throw lineError(line, 'Use a distance, a ladder such as “400-600-400-200 2min rest”, or repeats such as “5x150 90s rest”.');
    const description = (runMatch[2] || '').trim();
    if (/\b(?:rest|break|recovery|between|sets?|reps?)\b/i.test(description)) throw lineError(line, 'Include a duration with recovery, for example “90s rest”.');
    const distances = runMatch[1].split(/\s*[-,]\s*/).map(token => {
      const match = token.trim().match(/^(\d+(?:\.\d+)?)\s*(km|m)?$/i);
      const distance = Number(match[1]) * (match[2]?.toLowerCase() === 'km' ? 1000 : 1);
      if (distance <= 0 || distance > 100000) throw lineError(line, 'Each distance must be greater than 0 and at most 100,000m.');
      return distance;
    });
    const count = distances.length * repetitions;
    const lineBlocks = [];
    if (!sets || !repetitions || sets * count + steps.length > MAX_RUNS) throw lineError(line, 'Use at least one run and no more than 1,000 runs per workout.');
    const baseTitle = `${repetitions > 1 ? `${repetitions} × ` : ''}${distances.length === 1 ? distanceLabel(distances[0]) : `${distances.join('–')}m`}${description ? ` ${description}` : ''}`;
    for (let set = 0; set < sets; set++) {
      const blockIndex = blocks.length;
      lineBlocks.push(blockIndex);
      const blockTitle = sets > 1 ? `Set ${set + 1} · ${baseTitle}` : baseTitle;
      const startIndex = steps.length;
      blocks.push({title: blockTitle, startIndex, count});
      for (let i = 0; i < count; i++) {
        const distance = distances[i % distances.length];
        steps.push({index: steps.length, distance, splits: splitDistances(splitSpec, distance), label: `${distanceLabel(distance)}${description ? ` ${description}` : ''}`,
          blockIndex, blockTitle, repInBlock: i + 1, repsInBlock: count,
          restAfterSeconds: i === count - 1 && set < sets - 1 ? setRest ?? repRest : repRest,
          repeatRestSeconds: repRest});
      }
    }
    if (inlineBreak != null) steps.at(-1).restAfterSeconds = inlineBreak;
    lines.push({text: raw.trim(), blocks: lineBlocks, restText: ''});
    pendingRest = null;
  }
  if (!steps.length) throw new Error('Add at least one running block.');
  if (pendingRest != null) throw lineError(pendingRest, 'Add the next running block after this recovery, or remove the final recovery line.');
  steps.at(-1).restAfterSeconds = 0;
  return {steps, blocks, lines, title: blocks.map(block => block.title).join(' → ')};
}

/** Legacy set-based sessions remain readable alongside mixed plans. */
function getPlan(group) {
  if (group.mode === 'free') return [];
  if (Array.isArray(group.plan) && group.plan.length) return group.plan;
  const count = Math.min(MAX_RUNS, group.sets * group.repsPerSet + (group.extraReps || 0));
  return Array.from({length: count}, (_, index) => {
    const blockIndex = Math.floor(index / group.repsPerSet);
    return {index, distance: group.distance, label: distanceLabel(group.distance), blockIndex,
      blockTitle: `Set ${blockIndex + 1} · ${group.repsPerSet} × ${distanceLabel(group.distance)}`,
      repInBlock: index % group.repsPerSet + 1, repsInBlock: Math.min(group.repsPerSet, count - blockIndex * group.repsPerSet),
      restAfterSeconds: index === count - 1 ? 0 : (index + 1) % group.repsPerSet === 0 ? group.setRestSeconds : group.restSeconds,
      repeatRestSeconds: group.restSeconds};
  });
}

function getStep(group, index = group.repIndex) {
  if (group.mode === 'free') return {index, distance: group.distance, label: distanceLabel(group.distance), blockIndex: 0,
    blockTitle: 'Free timing', repInBlock: index + 1, repsInBlock: null, restAfterSeconds: group.restSeconds, repeatRestSeconds: group.restSeconds};
  return getPlan(group)[index] || null;
}

/** The workout as the coach wrote it, one entry per line, each tied to its blocks. Null when there is no written plan. */
function workoutLines(group) {
  if (group.mode === 'free' || !group.workoutText) return null;
  try {return parseWorkout(group.workoutText).lines;} catch {return null;}
}

function workoutSummary(group) {
  if (group.mode === 'free') return 'Free timing';
  if (!group.workoutText) return `${group.sets} × ${group.repsPerSet} × ${distanceLabel(group.distance)}`;
  return [...new Set(getPlan(group).map(step => step.blockTitle))].join(' → ');
}

function makeGroup(id, values = {}) {
  const names = values.athleteNames || [ 'Johnny Forte', 'Lorenzo Pantaleo', 'Arthur Sweeny', 'Aiden Victorio', 'Nick Lawrence', 'Santino Jimenez'];
  if (!Array.isArray(names) || !names.length || names.some(n => !String(n).trim())) throw new Error('Add at least one athlete with a name.');
  const mode = values.mode === 'free' ? 'free' : 'planned';
  if (values.workoutText != null && typeof values.workoutText !== 'string') throw new Error('Enter the workout as text.');
  const workoutText = (values.workoutText || '').trim();
  if (workoutText.length > 8000) throw new Error('Keep the workout under 8,000 characters.');
  const plan = workoutText && mode === 'planned' ? parseWorkout(workoutText).steps : null;
  return {
    id, name: String(values.name || 'New group').trim(), color: values.color === 'orange' ? 'orange' : 'green',
    sheetColor: ['blue', 'red', 'yellow'].includes(values.sheetColor) ? values.sheetColor : values.color === 'orange' ? 'red' : 'blue',
    mode, workoutText, plan,
    sets: Math.floor(number(values.sets, 2, 1, 20)),
    repsPerSet: Math.floor(number(values.repsPerSet, 4, 1, 50)),
    distance: number(values.distance, 400, 1, 100000),
    restSeconds: number(values.restSeconds, 60), setRestSeconds: number(values.setRestSeconds, 360),
    recoveryMode: values.recoveryMode === 'manual' ? 'manual' : 'auto',
    athletes: names.map((name, i) => ({id: `${id}-athlete-${i + 1}`, name: String(name).trim(), pack: null, mods: {}, goals: {}})),
    packs: [],
    repIndex: 0, extraReps: 0, records: [freshRep(0)], recovery: null, completed: false,
  };
}

function createSession(now = Date.now()) {
  return {id: `session-${now}`, name: 'Afternoon practice', createdAt: now,
    groups: [makeGroup('group-a', {name: 'Distance', workoutText: SAMPLE_WORKOUT}), makeGroup('group-b', {
      name: 'Mid Distance', color: 'orange', sets: 2, repsPerSet: 4, distance: 400,
      restSeconds: 60, setRestSeconds: 360, athleteNames: ['Nick Lawrence', 'Daniel Sanchez', 'Eddie Panniccia', 'Myles Taylor', 'Ethan Wu'],
    })], activeGroupId: 'group-a', prefs: {finishedToBottom: true, showGoals: true}};
}

const plannedDistances = group => { const seen = []; for (const step of getPlan(group)) if (!seen.includes(step.distance)) seen.push(step.distance); return seen; };
/** A runner's goal (seconds) for a run, looked up by the run's planned distance. */
function goalFor(group, athlete, index = group.repIndex) {
  const goal = athlete.goals?.[getStep(group, index)?.distance];
  return typeof goal === 'number' ? goal : null;
}
const clockText = seconds => { const t = Math.round(seconds * 10) / 10, m = Math.floor(t / 60), sec = t - m * 60; return `${m}:${Number.isInteger(sec) ? String(sec).padStart(2, '0') : sec.toFixed(1).padStart(4, '0')}`; };
/** 'clock' gives 1:15; 'sheet' gives 75 under 100 seconds and 6:40 above, the way coaches write them. */
function goalText(seconds, style = 'clock') {
  if (seconds == null) return '';
  const t = Math.round(seconds * 10) / 10;
  return style === 'sheet' && t < 100 ? String(t) : clockText(t);
}
function goalString(group, athlete) {
  const list = plannedDistances(group).map(d => athlete.goals?.[d]);
  let last = list.length - 1; while (last >= 0 && typeof list[last] !== 'number') last--;
  return list.slice(0, last + 1).map(g => typeof g === 'number' ? goalText(g, 'sheet') : '-').join(', ');
}

function getGroup(state, id = state.activeGroupId) {
  const group = state.groups.find(g => g.id === id);
  if (!group) throw new Error('Group not found.');
  return group;
}

const currentRep = group => group.records.find(rep => rep.index === group.repIndex);

function recoveryRemaining(group, now = Date.now()) {
  return group.recovery ? Math.max(0, group.recovery.durationMs - (now - group.recovery.startedAt)) : 0;
}

function phase(group, now = Date.now()) {
  if (group.completed) return 'complete';
  if (group.recovery) return recoveryRemaining(group, now) > 0 ? 'recovery' : 'ready-next';
  const rep = currentRep(group);
  if (completeRep(group, rep)) return 'ready-next';
  if (Object.keys(rep.starts).length || Object.keys(rep.finishes).length || rep.unassigned.length) return 'running';
  return 'ready';
}

/** Pass {start: rep.starts[id], finish: rep.finishes[id]}. */
function elapsed(record, now = Date.now()) {
  if (!record) return 0;
  if (typeof record.ms === 'number') return Math.max(0, record.ms);
  if (typeof record.finish?.ms === 'number') return Math.max(0, record.finish.ms);
  const start = record.start ?? record.startedAt;
  if (start == null) return 0;
  const finishAt = typeof record.finish === 'number' ? record.finish : record.finishedAt ?? record.closedAt;
  return Math.max(0, (finishAt ?? now) - start);
}

function restDuration(group) {
  return (getStep(group)?.restAfterSeconds ?? group.restSeconds) * 1000;
}

function settle(group, now, manualEntry = false) {
  const rep = currentRep(group);
  if (!completeRep(group, rep)) return;
  if (isFinal(group)) {
    group.completed = true;
    rep.closed = true;
    rep.closedAt = now;
    group.recovery = null;
  } else if (group.recoveryMode === 'auto' && !group.recovery) {
    const finishTimes = Object.values(rep.finishes).map(f => f.at);
    const startedAt = manualEntry || !finishTimes.length ? now : Math.max(...finishTimes);
    group.recovery = {startedAt, durationMs: restDuration(group), manual: false};
  }
}

function act(state, action, now = Date.now()) {
  const next = clone(state);
  if (action.type === 'SELECT_GROUP') {getGroup(next, action.groupId); next.activeGroupId = action.groupId; return next;}
  if (action.type === 'ADD_GROUP') {
    let id = `group-${now}`;
    while (next.groups.some(g => g.id === id)) id += '-new';
    next.groups.push(makeGroup(id, action.values)); next.activeGroupId = id; return next;
  }
  if (action.type === 'END_SESSION') {
    for (const group of next.groups) {
      const active = currentRep(group);
      if (touched(active)) {active.closed = true; active.closedAt ??= now;}
      group.completed = true; group.recovery = null;
    }
    next.completed = true; return next;
  }
  if (action.type === 'SET_PREF') {
    if (!['finishedToBottom', 'showGoals'].includes(action.key)) throw new Error('Unknown setting.');
    next.prefs = {...(next.prefs || {}), [action.key]: !!action.value}; return next;
  }
  const group = getGroup(next, action.groupId);
  const rep = currentRep(group);
  group.packs ??= [];
  rep.modSkipped ??= [];
  if (action.type === 'DELETE_GROUP') {
    if (next.groups.length <= 1) throw new Error('A session needs at least one group.');
    next.groups = next.groups.filter(g => g.id !== group.id);
    if (next.activeGroupId === group.id) next.activeGroupId = next.groups[0].id;
    return next;
  }
  if (action.type === 'DELETE_ATHLETE') {
    if (!group.athletes.some(a => a.id === action.athleteId)) throw new Error('Athlete not found.');
    if (group.athletes.length <= 1) throw new Error('A group needs at least one runner.');
    group.athletes = group.athletes.filter(a => a.id !== action.athleteId);
    for (const r of group.records) {
      delete r.starts[action.athleteId]; delete r.finishes[action.athleteId]; delete r.splits?.[action.athleteId];
      r.skipped = r.skipped.filter(id => id !== action.athleteId); r.modSkipped = (r.modSkipped || []).filter(id => id !== action.athleteId);
    }
    if (!group.completed && !rep.closed && touched(rep)) settle(group, now, true);
    return next;
  }
  if (action.type === 'ADD_ATHLETE') {
    const name = String(action.name || '').trim();
    if (!name) throw new Error('Enter a name.');
    if (group.athletes.length >= 50) throw new Error('Use up to 50 runners per group.');
    const used = group.athletes.map(a => Number(a.id.split('-athlete-')[1]) || 0);
    const id = `${group.id}-athlete-${Math.max(0, ...used) + 1}`;
    group.athletes.push({id, name, pack: null, mods: {}, goals: {}});
    for (const r of group.records) if (r.index < group.repIndex || r.closed) {r.skipped.push(id); r.modSkipped.push(id);}
    return next;
  }
  if (action.type === 'MOVE_ATHLETE') {
    const index = group.athletes.findIndex(a => a.id === action.athleteId);
    if (index < 0) throw new Error('Athlete not found.');
    const [athlete] = group.athletes.splice(index, 1);
    if (action.packId !== undefined) {
      if (action.packId !== null && !group.packs.some(p => p.id === action.packId)) throw new Error('Pack not found.');
      athlete.pack = action.packId;
    }
    let at = group.athletes.length;
    if (action.beforeId) at = group.athletes.findIndex(a => a.id === action.beforeId);
    else if (action.afterId) at = group.athletes.findIndex(a => a.id === action.afterId) + 1;
    group.athletes.splice(at < 0 ? group.athletes.length : at, 0, athlete);
    return next;
  }
  if (action.type === 'MOVE_PACK') {
    const index = group.packs.findIndex(p => p.id === action.packId);
    if (index < 0) throw new Error('Pack not found.');
    const [pack] = group.packs.splice(index, 1);
    let at;
    if (action.dir) at = Math.max(0, Math.min(group.packs.length, index + (action.dir < 0 ? -1 : 1)));
    else if (action.beforeId) at = group.packs.findIndex(p => p.id === action.beforeId);
    else at = group.packs.length;
    group.packs.splice(at < 0 ? group.packs.length : at, 0, pack);
    return next;
  }
  if (action.type === 'SET_GOALS') {
    const athlete = group.athletes.find(a => a.id === action.athleteId);
    if (!athlete) throw new Error('Athlete not found.');
    athlete.goals ??= {};
    for (const [key, value] of Object.entries(action.goals || {})) {
      const distance = Number(key);
      if (!(distance > 0)) throw new Error('That distance is not valid.');
      if (value == null || value === '') delete athlete.goals[distance];
      else { const seconds = typeof value === 'number' ? value : timeSeconds(value); athlete.goals[distance] = number(seconds, NaN, 1, 86400); }
    }
    return next;
  }
  if (action.type === 'SET_PACKS') {
    const packs = (action.packs || []).map((p, i) => ({id: String(p.id), name: String(p.name || '').trim() || `Pack ${i + 1}`}));
    if (packs.length > MAX_PACKS) throw new Error(`Use up to ${MAX_PACKS} packs.`);
    if (new Set(packs.map(p => p.id)).size !== packs.length) throw new Error('Pack ids must be unique.');
    group.packs = packs;
    for (const athlete of group.athletes) {
      const wanted = action.assignments && has(action.assignments, athlete.id) ? action.assignments[athlete.id] : athlete.pack;
      athlete.pack = packs.some(p => p.id === wanted) ? wanted : null;
    }
    return next;
  }
  if (action.type === 'SET_MODS') {
    if (group.mode === 'free') throw new Error('Per-runner changes need a planned workout.');
    const ids = action.athleteIds || [];
    const targets = group.athletes.filter(a => ids.includes(a.id));
    if (!targets.length) throw new Error('Choose at least one runner.');
    for (const [key, change] of Object.entries(action.changes || {})) {
      const step = Number(key);
      if (!Number.isInteger(step) || step < 0 || step >= totalReps(group)) throw new Error('That run is not part of the workout.');
      let value = null;
      if (change?.skip) value = {skip: true};
      else if (change?.distance != null) value = {distance: number(change.distance, NaN, 1, 100000)};
      for (const athlete of targets) {
        athlete.mods ??= {};
        if (value) athlete.mods[step] = clone(value); else delete athlete.mods[step];
      }
    }
    if (!group.completed) {
      syncPlannedSkips(group, rep);
      if (touched(rep)) settle(group, now, true);
    }
    return next;
  }
  if (action.type === 'UPDATE_GROUP') {
    if (group.records.some(touched)) throw new Error('Edit a group before recording its first rep.');
    const updated = makeGroup(group.id, {...group, athleteNames: group.athletes.map(a => a.name), ...action.values});
    updated.packs = group.packs || [];
    const sameWorkout = updated.workoutText === group.workoutText && updated.mode === group.mode;
    for (const athlete of updated.athletes) {
      const old = group.athletes.find(o => o.name === athlete.name);
      if (!old) continue;
      if (old.pack && updated.packs.some(p => p.id === old.pack)) athlete.pack = old.pack;
      athlete.goals = clone(old.goals || {});
      if (sameWorkout) athlete.mods = clone(old.mods || {});
    }
    syncPlannedSkips(updated, updated.records[0]);
    next.groups[next.groups.findIndex(g => g.id === group.id)] = updated;
    return next;
  }
  if (action.type === 'SET_RECOVERY_MODE') {
    if (!['auto', 'manual'].includes(action.mode)) throw new Error('Choose automatic or manual recovery.');
    group.recoveryMode = action.mode; return next;
  }
  if (action.type === 'ADD_REP') {
    if (group.mode === 'planned') {
      if (totalReps(group) >= MAX_RUNS) throw new Error('A workout can contain at most 1,000 runs.');
      group.extraReps = (group.extraReps || 0) + 1;
      if (Array.isArray(group.plan) && group.plan.length) {
        const last = group.plan.at(-1);
        last.restAfterSeconds = last.repeatRestSeconds ?? group.restSeconds;
        for (const step of group.plan) if (step.blockIndex === last.blockIndex) {
          step.repsInBlock += 1;
          if (!step.blockTitle.endsWith(' + extra reps')) step.blockTitle += ' + extra reps';
        }
        group.plan.push({...last, index: last.index + 1, repInBlock: last.repInBlock + 1,
          label: `${last.label.replace(/ · extra$/, '')} · extra`, restAfterSeconds: 0});
      }
    }
    if (group.completed || rep.closed) {
      group.completed = false; group.recovery = null; group.repIndex += 1;
      group.records.push(freshRepFor(group, group.repIndex));
      next.completed = false;
    }
    return next;
  }
  if (action.type === 'CLEAR_SPLITS') {
    const target = action.repIndex == null ? rep : group.records.find(r => r.index === action.repIndex);
    if (!target) throw new Error('Rep not found.');
    if (target.splits) delete target.splits[action.athleteId];
    return next;
  }
  if (action.type === 'SET_TIME') {
    if (!group.athletes.some(a => a.id === action.athleteId)) throw new Error('Athlete not found.');
    const target = action.repIndex == null ? rep : group.records.find(r => r.index === action.repIndex);
    if (!target) throw new Error('Rep not found.');
    const ms = Math.round(number(action.ms, NaN, 0, 86400000));
    target.finishes[action.athleteId] = {ms, at: now, manual: true};
    target.skipped = target.skipped.filter(id => id !== action.athleteId);
    if (target === rep && !group.completed) settle(group, now, true);
    return next;
  }
  if (action.type === 'ASSIGN_FINISH') {
    if (!group.athletes.some(a => a.id === action.athleteId)) throw new Error('Athlete not found.');
    const target = action.repIndex == null ? rep : group.records.find(r => r.index === action.repIndex);
    if (!target) throw new Error('Rep not found.');
    const capture = target.unassigned.find(c => c.id === action.captureId);
    if (!capture) throw new Error('Finish capture not found.');
    if (!has(target.starts, action.athleteId)) throw new Error('This athlete has not started.');
    if (has(target.finishes, action.athleteId) || target.skipped.includes(action.athleteId)) throw new Error('This athlete already has a result.');
    if (capture.at < target.starts[action.athleteId]) throw new Error('This finish was captured before the athlete started.');
    target.finishes[action.athleteId] = {ms: capture.at - target.starts[action.athleteId], at: capture.at, manual: false};
    target.unassigned = target.unassigned.filter(c => c.id !== action.captureId);
    if (target === rep && !group.completed && !target.closed) settle(group, now);
    return next;
  }
  if (action.type === 'REMOVE_CAPTURE') {
    const target = action.repIndex == null ? rep : group.records.find(r => r.index === action.repIndex);
    if (!target) throw new Error('Rep not found.');
    if (!target.unassigned.some(c => c.id === action.captureId)) throw new Error('Finish capture not found.');
    target.unassigned = target.unassigned.filter(c => c.id !== action.captureId);
    return next;
  }
  if (action.type === 'SKIP_ATHLETE') {
    if (!group.athletes.some(a => a.id === action.athleteId)) throw new Error('Athlete not found.');
    const target = action.repIndex == null ? rep : group.records.find(r => r.index === action.repIndex);
    if (!target) throw new Error('Rep not found.');
    if (has(target.finishes, action.athleteId)) throw new Error('This athlete already has a time.');
    if (!target.skipped.includes(action.athleteId)) target.skipped.push(action.athleteId);
    if (target === rep && !group.completed && !target.closed) settle(group, now);
    return next;
  }
  if (group.completed || rep.closed) throw new Error('This group is complete.');
  if (action.athleteId != null && !group.athletes.some(a => a.id === action.athleteId)) throw new Error('Athlete not found.');
  switch (action.type) {
    case 'START_ALL':
      for (const athlete of group.athletes) {
        if (!has(rep.starts, athlete.id) && !has(rep.finishes, athlete.id) && !rep.skipped.includes(athlete.id)) rep.starts[athlete.id] = now;
      }
      break;
    case 'START_ONE':
      if (!has(rep.starts, action.athleteId) && !has(rep.finishes, action.athleteId) && !rep.skipped.includes(action.athleteId)) rep.starts[action.athleteId] = now;
      break;
    case 'FINISH':
      if (!has(rep.starts, action.athleteId)) throw new Error('Start this athlete first, or enter a time manually.');
      if (has(rep.finishes, action.athleteId) || rep.skipped.includes(action.athleteId)) throw new Error('This athlete already has a result.');
      rep.finishes[action.athleteId] = {ms: Math.max(0, now - rep.starts[action.athleteId]), at: now, manual: false};
      settle(group, now);
      break;
    case 'QUICK_FINISH': {
      if (!Object.keys(rep.starts).length) throw new Error('Start the rep before capturing a finish.');
      let id = `capture-${now}-${rep.unassigned.length}`;
      while (rep.unassigned.some(c => c.id === id)) id += '-new';
      rep.unassigned.push({id, at: now});
      break;
    }
    case 'SPLIT':
    case 'SPLIT_ALL': {
      rep.splits ??= {};
      const limit = splitCapacity(getStep(group));
      const running = id => has(rep.starts, id) && !has(rep.finishes, id) && !rep.skipped.includes(id);
      const targets = action.type === 'SPLIT' ? [action.athleteId] : group.athletes.map(a => a.id).filter(running);
      if (action.type === 'SPLIT') {
        if (!has(rep.starts, action.athleteId)) throw new Error('Start this athlete before taking a split.');
        if (!running(action.athleteId)) throw new Error('This athlete already finished.');
        if ((rep.splits[action.athleteId] || []).length >= limit) throw new Error('All splits are already recorded for this rep.');
      }
      let taken = 0;
      for (const id of targets) {
        const list = rep.splits[id] ||= [];
        if (list.length >= limit) continue;
        list.push({ms: Math.max(0, now - rep.starts[id]), at: now});
        taken++;
      }
      if (!taken) throw new Error('No runners are available for a split.');
      break;
    }
    case 'START_PACK':
    case 'FINISH_PACK':
    case 'SPLIT_PACK': {
      if (!group.packs.some(p => p.id === action.packId)) throw new Error('Pack not found.');
      const members = group.athletes.filter(a => a.pack === action.packId).map(a => a.id);
      const live = id => has(rep.starts, id) && !has(rep.finishes, id) && !rep.skipped.includes(id);
      if (action.type === 'START_PACK') {
        const ready = members.filter(id => !has(rep.starts, id) && !has(rep.finishes, id) && !rep.skipped.includes(id));
        if (!ready.length) throw new Error('Nobody in this pack is waiting to start.');
        for (const id of ready) rep.starts[id] = now;
      } else if (action.type === 'FINISH_PACK') {
        const running = members.filter(live);
        if (!running.length) throw new Error('Nobody in this pack is running.');
        for (const id of running) rep.finishes[id] = {ms: Math.max(0, now - rep.starts[id]), at: now, manual: false};
        settle(group, now);
      } else {
        const limit = splitCapacity(getStep(group));
        rep.splits ??= {};
        const running = members.filter(id => live(id) && (rep.splits[id] || []).length < limit);
        if (!running.length) throw new Error('Nobody in this pack is available for a split.');
        for (const id of running) (rep.splits[id] ||= []).push({ms: Math.max(0, now - rep.starts[id]), at: now});
      }
      break;
    }
    case 'RESET_REP': {
      // Back to a clean, not-yet-started rep (planned skips stay). Any rest that began from this rep is cancelled.
      const fresh = freshRepFor(group, rep.index);
      Object.assign(rep, {starts: {}, finishes: {}, splits: {}, unassigned: [], skipped: fresh.skipped, modSkipped: fresh.modSkipped});
      group.recovery = null;
      break;
    }
    case 'RESET_REST':
      if (!group.recovery) throw new Error('No rest is running.');
      if (action.stop) group.recovery = null;
      else group.recovery = {startedAt: now, durationMs: restDuration(group), manual: group.recovery.manual};
      break;
    case 'START_RECOVERY':
      if (!group.recovery) group.recovery = {startedAt: now, durationMs: restDuration(group), manual: true};
      break;
    case 'ADD_REST':
      if (!group.recovery) throw new Error('Start recovery first.');
      group.recovery.durationMs += number(action.seconds, 30, 0, 86400) * 1000;
      break;
    case 'NEXT_REP':
      rep.closed = true;
      rep.closedAt = now;
      group.recovery = null;
      if (isFinal(group)) group.completed = true;
      else {group.repIndex += 1; group.records.push(freshRepFor(group, group.repIndex));}
      break;
    default: throw new Error(`Unknown action: ${action.type}`);
  }
  return next;
}

function formatTime(ms) {
  const centiseconds = Math.floor(Math.max(0, Math.round(Number(ms) || 0)) / 10);
  const minutes = Math.floor(centiseconds / 6000);
  const seconds = Math.floor((centiseconds % 6000) / 100);
  return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(centiseconds % 100).padStart(2, '0')}`;
}

function csvCell(value) {
  let text = String(value ?? '');
  if (/^[\s]*[=+\-@]/.test(text) || /^[\t\r\n]/.test(text)) text = `'${text}`;
  return `"${text.replaceAll('"', '""')}"`;
}

function exportDetailCsv(state) {
  const maxSplits = Math.max(0, ...state.groups.flatMap(g => g.records.map(r => Math.max(0, ...Object.values(r.splits || {}).map(l => l.length)))));
  const splitHeaders = Array.from({length: maxSplits}, (_, i) => [`split_${i + 1}_label`, `split_${i + 1}_seconds`]).flat();
  const rows = [['date', 'group', 'athlete', 'pack', 'set', 'rep', 'planned_distance', 'distance', 'status', 'time_seconds', 'source', 'block', 'run_label', ...splitHeaders, ...(maxSplits ? ['after_last_split_seconds'] : [])]];
  const created = new Date(state.createdAt);
  const date = `${created.getFullYear()}-${String(created.getMonth() + 1).padStart(2, '0')}-${String(created.getDate()).padStart(2, '0')}`;
  for (const group of state.groups) for (const rep of group.records.filter(touched)) {
    const planStep = getStep(group, rep.index);
    for (const athlete of group.athletes) {
      const finish = rep.finishes[athlete.id];
      const mine = athletePlan(group, athlete, rep.index);
      rows.push([date, group.name, athlete.name, (group.packs || []).find(p => p.id === athlete.pack)?.name ?? '',
        (planStep?.blockIndex ?? 0) + 1,
        planStep?.repInBlock ?? rep.index + 1,
        mine.planned, mine.distance, finish ? 'recorded' : rep.skipped.includes(athlete.id) ? 'skipped' : 'missing',
        finish ? (finish.ms / 1000).toFixed(2) : '', finish ? finish.manual ? 'manual' : 'stopwatch' : '',
        planStep?.blockTitle ?? '', planStep?.label ?? '',
        ...Array.from({length: maxSplits}, (_, i) => { const sp = (rep.splits?.[athlete.id] || [])[i]; return sp ? [splitLabel(planStep, i), (sp.ms / 1000).toFixed(2)] : ['', '']; }).flat(),
        ...(maxSplits ? [(() => { const list = rep.splits?.[athlete.id] || []; return finish && list.length ? ((finish.ms - list.at(-1).ms) / 1000).toFixed(2) : ''; })()] : []),
      ]);
    }
  }
  return rows.map(row => row.map(csvCell).join(',')).join('\r\n');
}

function groupTabs(){return `<div class="group-tabs" aria-label="Workout groups">${session.groups.map(g=>`<button class="group-tab ${g.id===session.activeGroupId?'active':''} ${g.color} ${tabAttention(g)?'attention':''}" data-group-tab="${e(g.id)}" data-action="select-group" data-group="${e(g.id)}" aria-pressed="${g.id===session.activeGroupId}"><span><strong>${e(g.name)}</strong><small><span class="tab-status" data-group-phase="${e(g.id)}">${tabStatus(g)}</span> · ${g.athletes.length}</small></span></button>`).join('')}<button class="add-group" data-action="add-group" aria-label="Add a group">${icon('plus')}</button></div>`;}
function timerCard(g){const p=phase(g),r=currentRep(g),s=getStep(g),next=getStep(g,g.repIndex+1),started=Object.keys(r.starts).length,done=Object.keys(r.finishes).length+r.skipped.length,running=g.athletes.some(a=>r.starts[a.id]!=null&&!r.finishes[a.id]&&!r.skipped.includes(a.id)),canReset=p==='running'||p==='recovery'||p==='ready-next';let actions='';
  if(p==='complete')actions=btn('Results','view-results',{icon:'chart',class:'primary'})+btn('Extra rep','add-rep',{icon:'plus'});
  else if(p==='ready')actions=btn('Start all','start-all',{icon:'play',class:'primary'})+btn('Start rest','start-recovery',{icon:'clock'});
  else if(g.recovery)actions=(running?btn('Capture finish','quick-finish',{icon:'flag',class:'capture'}):'')+btn('Next rep','next-rep',{icon:'play',class:running?'':'primary'})+btn('+30s','add-rest',{attrs:'data-seconds="30"',class:'rest-add'});
  else if(done===g.athletes.length)actions=btn('Start rest','start-recovery',{icon:'clock',class:'primary'})+btn('Next rep','next-rep',{icon:'play'});

  return `<section class="timing-card" aria-label="Group stopwatch"><div class="timer-top"><span class="timer-step-title">${e(stepTitle)}</span><span class="timer-top-right">${canReset?`<button class="timer-reset" data-action="reset-menu" aria-label="Stop or reset the clock">${icon('reset',14)}Reset</button>`:''}<span class="phase-pill"><span data-phase-label>${p==='running'?'RUNNING':p==='recovery'?'RECOVERY':p==='complete'?'SAVED':'READY'}</span></span></span></div><div class="timer-center"><div class="timer-context">${p==='complete'?`${g.records.filter(hasData).length} reps recorded`:g.recovery?`After ${e(s?.label||'this rep')}`:e(timerContext(g,s))}</div><div class="big-timer ${p==='complete'?'clock-complete':''}" data-main-clock>00:00<span class="fraction">.00</span></div></div><div class="timer-actions">${actions}</div><div class="timer-foot"><div class="upnext">${upNext(g)}</div>${p==='ready'||p==='complete'?'':`<button class="small-link" data-action="next-rep">Skip rep</button>`}</div></section>`;}
function timerCaption(g){return '';}
function sectionMembers(g,r,members){if(!sortPref()||g.completed||r.closed)return members;const key=a=>r.skipped.includes(a.id)?2:r.finishes[a.id]?1:0;return members.map((a,i)=>[a,i]).sort((x,y)=>key(x[0])-key(y[0])||(key(x[0])===1?r.finishes[x[0].id].at-r.finishes[y[0].id].at:x[1]-y[1])).map(x=>x[0]);}

function captureList(g,r){if(!r.unassigned.length)return '';const firstStart=Math.min(...Object.values(r.starts));return `<div class="unassigned"><h3>${r.unassigned.length} finish${r.unassigned.length===1?'':'es'} to assign</h3>${r.unassigned.map(c=>`<div class="capture-row"><span>${formatTime(c.at-firstStart)}</span><label class="sr-only" for="capture-${e(c.id)}">Athlete for captured finish</label><select class="form-control" id="capture-${e(c.id)}" data-capture="${e(c.id)}" data-group="${e(g.id)}" data-rep="${r.index}"><option value="">Choose runner</option>${g.athletes.filter(a=>r.starts[a.id]!=null&&!r.finishes[a.id]&&!r.skipped.includes(a.id)&&r.starts[a.id]<=c.at).map(a=>`<option value="${e(a.id)}">${e(a.name)}</option>`).join('')}</select><button class="btn icon-btn ghost" data-action="remove-capture" data-group="${e(g.id)}" data-rep="${r.index}" data-capture-id="${e(c.id)}" aria-label="Remove this unassigned finish">${icon('close',16)}</button></div>`).join('')}</div>`;}

function resultTable(g){const recordIndexes=g.records.filter(hasData).map(r=>r.index),n=g.mode==='free'?Math.max(1,g.repIndex+1):total(g);return `<div class="table-scroll"><table><thead><tr><th scope="col">Athlete</th>${hasGoals(g)?'<th scope="col">Goal</th>':''}${Array.from({length:n},(_,i)=>{const s=getStep(g,i);return `<th scope="col" title="${e(s?.blockTitle)}">${e(s?.label||'Rep')}<small>Rep ${i+1}</small></th>`;}).join('')}<th scope="col">Recorded</th></tr></thead><tbody>${g.athletes.map(a=>{const values=g.records.map(r=>r.finishes[a.id]?.ms).filter(v=>v!=null),pk=(g.packs||[]).find(p=>p.id===a.pack);return `<tr><td>${e(a.name)}${pk?`<span class="pack-tag" style="--pack:${packColor(g,pk)}">${e(pk.name)}</span>`:''}</td>${hasGoals(g)?`<td class="goal-cell">${e(goalString(g,a))}</td>`:''}${Array.from({length:n},(_,i)=>{const r=g.records.find(r=>r.index===i),f=r?.finishes[a.id],at=`data-action="edit-time" data-group="${e(g.id)}" data-athlete="${e(a.id)}" data-rep="${i}"`;return `<td>${f?`<button class="time-cell${goalClass(g,a,i,f)}" ${at} title="${f.manual?'Manually entered':'Stopwatch time'} · tap to edit">${formatTime(f.ms)}${f.manual?'*':''}</button>`:r?.skipped.includes(a.id)?`<button class="time-cell muted" ${at}>${(r.modSkipped||[]).includes(a.id)?'Skip':'DNS'}</button>`:recordIndexes.includes(i)?`<button class="time-cell missing-cell" ${at}>Missing</button>`:'<span class="empty-cell">—</span>'}${r?cellMeta(g,r,a):''}</td>`;}).join('')}<td>${values.length} / ${n}</td></tr>`;}).join('')}</tbody></table></div>`;}
function resultsView(){const records=session.groups.flatMap(g=>g.records),times=records.reduce((n,r)=>n+Object.keys(r.finishes).length,0),missing=session.groups.reduce((n,g)=>n+g.records.filter(hasData).reduce((n,r)=>n+g.athletes.filter(a=>!r.finishes[a.id]&&!r.skipped.includes(a.id)).length,0),0);return intro('Results',e(session.name),btn('Save','save-session',{icon:'save'})+btn('CSV','export',{icon:'download',class:'primary',attrs:'aria-label="Export CSV"'}),'intro-results')+sendRow()+`<div class="result-summary"><div class="card summary-stat"><span>Recorded</span><strong>${times}</strong></div><div class="card summary-stat"><span>Runners</span><strong>${session.groups.reduce((n,g)=>n+g.athletes.length,0)}</strong></div><div class="card summary-stat"><span>Missing</span><strong>${missing}</strong></div></div>${session.groups.map(g=>`<section class="card results-card"><div class="card-head"><div><h2>${e(g.name)}</h2><p>${g.mode==='free'?'Free timing':`${total(g)} runs · ${new Set(getPlan(g).map(s=>s.blockIndex)).size} blocks`}</p></div><button class="small-link" data-action="return-group" data-group="${e(g.id)}">Timer</button></div>${resultTable(g)}${g.records.map(r=>captureList(g,r)).join('')}</section>`).join('')}<p class="results-note">Swipe across for every rep. Tap any time to correct it.<br><b>*</b> Manual entry · <b>DNS</b> Did not run · <b>Skip</b> Planned skip.<br>The CSV matches this layout. <button class="small-link inline" data-action="export-detail">Detailed CSV</button> has one row per time, in seconds.</p>`;}
function setupView(){const archives=archiveRead();return intro('Workouts & groups','Build the practice you actually run.',btn('Load practice','practice-modal',{icon:'download',class:'primary'})+btn('New group','add-group',{icon:'plus'}))+`<div class="setup-content"><section class="card setup-panel"><div class="setup-group-list">${session.groups.map(g=>`<div class="setup-group"><div><h3>${e(g.name)}</h3><p>${g.mode==='free'?'Free timing':`${total(g)} runs · ${new Set(getPlan(g).map(s=>s.blockIndex)).size} blocks`} · ${g.athletes.length} runners</p></div>${btn('Load / edit','edit-group',{attrs:`data-group="${e(g.id)}"`})}${session.groups.length>1?btn('','delete-group',{icon:'trash',class:'ghost danger icon-btn',attrs:`data-group="${e(g.id)}" aria-label="Delete ${e(g.name)}" title="Delete group"`}):''}</div>`).join('')}</div><p class="form-help">Paste a tempo, ladder, repeats, and recovery breaks into one workout. Review the steps before loading.</p></section><section class="card setup-panel"><h2>Session details</h2><form id="session-form"><div class="field"><label for="session-name">Name</label><input class="form-control" id="session-name" name="name" maxlength="90" value="${e(session.name)}" required></div><div class="form-actions"><button class="btn primary" type="submit">Save name</button></div></form></section><section class="card setup-panel"><h2>Google Sheet</h2><p>${sheetOn()?'Connected. Results can post to your coach sheet and today’s practice can load from it.':'Not connected. Connect once to load practices from the sheet and send results to it.'}</p><div class="form-actions">${btn(sheetOn()?'Settings':'Connect','sheet-settings',{icon:'settings'})}${sheetOn()?btn('Send results now','send-sheet',{icon:'download'}):''}</div><p class="form-help" data-sheet-status>${e(sheetStatus||'')}</p></section><section class="card setup-panel"><h2>Save & export</h2><p>Results save in this browser. Export a separate copy for your records or Google Sheets.</p><div class="form- function render(){lastPhase=phase(current());$('#app').innerHTML=shell(view==='live'?liveView():view==='results'?resultsView():setupView());updateClocks();fitUpcoming();centerStrip();document.fonts?.ready.then(fitUpcoming);}
function centerStrip(){const strip=document.querySelector('.workout-strip'),cur=strip?.querySelector('.wl.current');if(cur)strip.scrollLeft=cur.offsetLeft-(strip.clientWidth-cur.offsetWidth)/2;}

let clockTick=0;
function updateClocks(){const now=Date.now();if(++clockTick%8===0)fitUpcoming();for(const g of session.groups){const p=phase(g,now);const badge=document.querySelector(`[data-group-phase="${g.id}"]`);if(badge)badge.textContent=tabStatus(g,now);const tab=document.querySelector(`[data-group-tab="${g.id}"]`);if(tab)tab.classList.toggle('attention',tabAttention(g,now));if(g.recovery&&recoveryRemaining(g,now)<=0){const id=g.id+':'+g.recovery.startedAt;if(!alerted.has(id)){alerted.add(id);if(now-(g.recovery.startedAt+g.recovery.durationMs)<3000){toast(`${g.name}: recovery complete. Ready when you are.`);beep();}}}}
  const g=current(),r=currentRep(g),p=phase(g,now);if(view==='live'&&p!==lastPhase&&!drag&&!swipe?.active){render();return;}
  const main=$('[data-main-clock]');if(main){if(p==='complete'){main.textContent='Well done.';}else if(g.recovery){const remain=recoveryRemaining(g,now);main.textContent=remain>0?`${String(Math.floor(Math.ceil(remain/1000)/60)).padStart(2,'0')}:${String(Math.ceil(remain/1000)%60).padStart(2,'0')}`:'Ready';main.classList.toggle('rest-ready',remain===0);}else{const starts=Object.values(r.starts);const outstanding=g.athletes.some(a=>r.starts[a.id]!=null&&!r.finishes[a.id]&&!r.skipped.includes(a.id));const finishes=Object.values(r.finishes);const end=outstanding?now:finishes.length?Math.max(...finishes.map(f=>f.at)):now;const t=starts.length?formatTime(Math.max(0,end-Math.min(...starts))):'00:00.00';const [whole,fraction]=t.split('.');main.innerHTML=`${whole}<span class="fraction">.${fraction}</span>`;}}
  for(const el of document.querySelectorAll('[data-athlete-clock]'))el.textContent=formatTime(elapsed({start:r.starts[el.dataset.athleteClock]},now));
}
function beep(){if(!soundOn)return;try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();const o=audioContext.createOscillator(),gain=audioContext.createGain();o.connect(gain);gain.connect(audioContext.destination);o.frequency.value=800;gain.gain.setValueAtTime(.08,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.45);o.start();o.stop(audioContext.currentTime+.45);}catch{}}
function modal(title,body,submit){const dialog=$('#modal');if(dialog.open)dialog.close();dialog.innerHTML=`<div class="modal-head"><h2>${e(title)}</h2><button class="btn ghost icon-btn" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button></div><div class="modal-body">${body}</div>`;dialog.showModal();const form=dialog.querySelector('form');if(form&&submit)form.addEventListener('submit',event=>{event.preventDefault();try{submit(new FormData(form));}catch(err){const error=dialog.querySelector('#group-error')||dialog.querySelector('.error-text');if(error)error.textContent=err.message;else toast(err.message);}});}
function closeModal(){$('#modal').close();}
function parseTime(value){const s=value.trim();if(!/^(?:\d+:)?\d+(?:\.\d{1,3})?$/.test(s))throw new Error('Use seconds (64.32) or minutes:seconds (1:04.32).');const parts=s.split(':').map(Number);if(parts.length===2&&parts[1]>=60)throw new Error('Seconds after the colon must be less than 60.');const ms=(parts.length===2?parts[0]*60+parts[1]:parts[0])*1000;if(ms>86400000)throw new Error('That time is too long.');return Math.round(ms);}
function editTime(groupId,athleteId,repIndex,full=false){const g=getGroup(session,groupId),a=g.athletes.find(a=>a.id===athleteId),r=g.records.find(r=>r.index===(repIndex??g.repIndex)),f=r.finishes[a.id],plan=athletePlan(g,a,r.index),packs=g.packs||[];

function modsSheet(ids,title){const g=current(),members=g.athletes.filter(a=>ids.includes(a.id)),steps=getPlan(g).slice(g.repIndex,g.repIndex+100),distances=[...new Set(steps.map(s=>s.distance))];
  const pre=i=>{const mods=members.map(a=>a.mods?.[i]||null),first=JSON.stringify(mods[0]);return mods.every(m=>JSON.stringify(m)===first)?mods[0]:null;};
  modal(title,`<p>Leave a row blank to follow the workout. Type a distance to change it, or tick Skip.${getPlan(g).length-g.repIndex>100?' Showing the next 100 runs.':''}</p><form id="mods-form"><div class="quick-fill"><span>Change every</span><select id="qf-from" class="form-control">${distances.map(d=>`<option value="${d}">${fmtDist(d)}</option>`).join('')}</select><span>to</span><input id="qf-to" class="form-control" inputmode="decimal" placeholder="meters" aria-label="New distance in meters"><button type="button" class="btn" data-action="quick-fill">Fill</button></div><div class="mod-list">${steps.map(s=>{const m=pre(s.index);return `<div class="mod-row ${s.index===g.repIndex?'now':''}"><span class="mod-label"><b>${s.index+1}</b>${e(s.label)}</span><input class="form-control mod-dist" data-step="${s.index}" data-planned="${s.distance}" inputmode="decimal" placeholder="${s.distance}" value="${m?.distance??''}" aria-label="Distance for run ${s.index+1}"><label class="mod-skip"><input type="checkbox" data-skip="${s.index}" ${m?.skip?'checked':''}>Skip</label></div>`;}).join('')}</div><div class="error-text" role="alert"></div><div class="modal-actions"><button type="button" class="btn ghost" data-action="clear-mod-rows">Clear all</button><button class="btn primary" type="submit">Save</button></div></form>`,()=>{const changes={};for(const input of document.querySelectorAll('#modal .mod-dist')){const i=Number(input.dataset.step),skip=document.querySelector(`#modal [data-skip="${i}"]`).checked,d=parseDist(input.value);changes[i]=skip?{skip:true}:d!=null&&d!==Number(input.dataset.planned)?{distance:d}:null;}if(dispatch({type:'SET_MODS',athleteIds:ids,changes},'Workout updated.'))closeModal();});}
